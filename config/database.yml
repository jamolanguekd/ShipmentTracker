default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  url: <%= ENV["DATABASE_URL"] %>

development:
  <<: *default
  url: <%= ENV.fetch("DATABASE_URL") { "postgresql://shipment_tracker:password@localhost:5432/shipment_tracker_development" } %>

test:
  <<: *default
  url: <%= ENV.fetch("TEST_DATABASE_URL") { ENV.fetch("DATABASE_URL", "").sub("_development", "_test").sub("shipment_tracker_development", "shipment_tracker_test") } %>

production:
  <<: *default
  url: <%= ENV["DATABASE_URL"] %>
